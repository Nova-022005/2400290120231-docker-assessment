version: '3.8'

services:
  db:
    image: postgres:17-alpine
    container_name: festpass_db
    environment:
      POSTGRES_DB: festpass
      POSTGRES_USER: festpass
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - db-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U festpass -d festpass"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: festpass_backend
    environment:
      - DB_HOST=db
      - DB_NAME=festpass
      - DB_USER=festpass
      - DB_PASSWORD=${DB_PASSWORD}
      - REGNO=202401100100232
      - APP_VERSION=0.1
    # Notice: No host ports mapped here. It communicates internally on port 5000 via Docker network.
    depends_on:
      db:
        condition: service_healthy
    networks:
      - db-net
      - frontend-net

  frontend:
    image: nginx:1.30-alpine
    container_name: festpass_frontend
    ports:
      - "8032:80"   # Frontend maps host port 8032 to container port 80
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - frontend-net

volumes:
  pgdata:

networks:
  db-net:
    driver: bridge
  frontend-net:
    driver: bridge