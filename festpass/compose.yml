version: '3.8'

services:
  db:
    image: postgres:17-alpine
    container_name: festpass_db
    environment:
      POSTGRES_DB: festpass
      POSTGRES_USER: festpass
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U festpass -d festpass"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - db-net

  backend:
    image: noavsaurav/fest-backend:1.0.0
    container_name: festpass_backend
    environment:
      - DB_HOST=db
      - DB_NAME=festpass
      - DB_USER=festpass
      - DB_PASSWORD=${DB_PASSWORD}
      - REGNO=202401100100232
      - APP_VERSION=1.0.0
    depends_on:
      db:
        condition: service_healthy
    networks:
      - db-net
      - frontend-net

  frontend:
    image: nginx:1.30-alpine
    container_name: festpass_frontend
    ports:
      - "8032:80"
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - frontend-net

volumes:
  db_data:

networks:
  db-net:
  frontend-net: